<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Murdoku: een logische puzzel waarin je uitzoekt wie waar stond en wie Vincent heeft vermoord.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1014" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Murdoku">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Murdoku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: een moderne puzzelgame, speels en strak
   IDEA   een bordspel-plattegrond met kamers als gekleurde tegels en verdachten als fiches met gezicht
   PICTURE het bord zelf, groot, met getekende meubels en gezichtjes
   COLOUR wit of bijna zwart, inkt, koraalrood voor de moord; frisse pasteltinten voor de kamers
   TYPE   Outfit voor koppen + Inter voor tekst
   LAYOUT laptop: bord links, verdachten en aanwijzingen rechts; telefoon: titel, bord, verdachten, aanwijzingen */
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#0f1014);--ink:light-dark(#14151a,#f0f0f3);--soft:light-dark(#6a6c78,#9d9fab);--line:light-dark(#e6e6ec,#2a2b33);--card:light-dark(#f5f5f8,#191a20);--hot:light-dark(#f2304f,#ff5a73);--wall:light-dark(#1d1e24,#e9e9ee);
--r0:#7a3a24;--r1:#6b580c;--r2:#1c5a36;--r3:#1f3f7a;--r4:#4f2d86;--r5:#7a2350;--alarm:#c8102e;
--wood:light-dark(#9a6533,#d39c62);--leaf:light-dark(#239455,#57c983);--pot:light-dark(#d06a3d,#e48a5d);--sheet:light-dark(#ffffff,#dedde6);--quilt:light-dark(#5a7fe0,#8aa6f0)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:max(20px,env(safe-area-inset-top)) max(4vw,16px,env(safe-area-inset-right)) 6px max(4vw,16px,env(safe-area-inset-left));max-width:1180px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;flex:none}
h1{font:800 clamp(26px,5vw,38px)/1.05 Outfit,sans-serif;margin:0;letter-spacing:-.03em}
.case b{color:var(--ink);font-weight:600}
.prow{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 4px 6px}
.prow h2{font:500 14px/1.2 Inter,sans-serif;color:var(--soft);margin:0;letter-spacing:0}
.clock{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:15px;color:var(--ink)}
.clock svg{width:16px;height:16px;color:var(--soft)}
.clock b{font-weight:600;font-variant-numeric:tabular-nums}
.acts{display:flex;align-items:center;gap:8px;flex:none}
.hbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.hbtn:hover{border-color:var(--ink)}
.hbtn svg{width:20px;height:20px;flex:none}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:15px}
.btn:hover{border-color:var(--ink)}
.btn.main{background:var(--ink);color:var(--bg);border-color:var(--ink)}
@media(hover:hover){.btn.main:hover{background:color-mix(in srgb,var(--ink) 85%,var(--hot))}}
.game{display:grid;gap:28px;padding:16px max(4vw,16px,env(safe-area-inset-right)) max(48px,env(safe-area-inset-bottom)) max(4vw,16px,env(safe-area-inset-left));max-width:1180px;margin:0 auto}
@media(min-width:900px){.game{grid-template-columns:minmax(0,580px) minmax(0,1fr);align-items:start;row-gap:14px}.game>section:first-child{display:contents}.stage{grid-column:1;grid-row:1/span 4}.people-row,.toolbar{grid-column:2}.people-row,.toolbar{margin-top:0}}
.stage{background:var(--card);border-radius:28px;padding:clamp(14px,2.6vw,22px)}
#board{--wall:#e9e9ee;--wood:#d39c62;--leaf:#57c983;--pot:#e48a5d;--sheet:#dedde6;--quilt:#8aa6f0;--bg:#16171c;--ink:#f0f0f3;position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));grid-template-rows:repeat(var(--n),minmax(0,1fr));aspect-ratio:1;width:100%;border:3px solid var(--wall);border-radius:18px;overflow:hidden;user-select:none;-webkit-user-select:none;box-shadow:0 18px 40px -18px rgba(20,20,40,.35);background:var(--wall)}
.cell{position:relative;border:0;border-top:1px solid color-mix(in srgb,var(--wall) 12%,transparent);border-left:1px solid color-mix(in srgb,var(--wall) 12%,transparent);display:grid;place-items:center;padding:0;background:var(--rc);touch-action:manipulation;transition:filter .15s}
.r0{--rc:var(--r0)}.r1{--rc:var(--r1)}.r2{--rc:var(--r2)}.r3{--rc:var(--r3)}.r4{--rc:var(--r4)}.r5{--rc:var(--r5)}
.cell.kleed::before,.rugsw{content:'';border-radius:5px;background:repeating-linear-gradient(45deg,transparent 0 5px,rgba(184,69,47,.32) 5px 6.5px),repeating-linear-gradient(-45deg,transparent 0 5px,rgba(184,69,47,.32) 5px 6.5px),#f6e7cc;box-shadow:0 0 0 2.5px #b8452f,inset 0 0 0 2.5px #f6e7cc,inset 0 0 0 4px #b8452f}
.cell.kleed::before{position:absolute;inset:18%;pointer-events:none}
.cell.blk{background:repeating-linear-gradient(-45deg,var(--rc) 0 7px,color-mix(in srgb,var(--rc) 78%,var(--wall)) 7px 8px);cursor:not-allowed}
.cell:hover:not(.blk){filter:brightness(1.06)}
.rl.sm{font-size:11px;left:4px}
.rl.ctr{left:50%;transform:translateX(-50%)}
.rl.over{z-index:5}
.walls{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:visible}
.walls path{fill:none;stroke:var(--wall);stroke-width:3.5px;stroke-linecap:square;vector-effect:non-scaling-stroke}
.bwrap{position:relative}
.rl{position:absolute;top:4px;left:6px;font:600 13px/1.35 Inter,sans-serif;padding:0 1px;color:rgba(255,255,255,.92);text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:1;pointer-events:none}
.ico{width:60%;height:60%;pointer-events:none;filter:drop-shadow(0 2px 0 rgba(0,0,0,.12))}
.cell.has .ico{position:absolute;right:3px;bottom:3px;width:32%;height:32%}
.cell{container-type:inline-size}
.notes{--ns:34cqw;position:absolute;inset:6cqw;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:4cqw;pointer-events:none;z-index:2}
.notes.m{--ns:26cqw}
.notes.l{--ns:20cqw;gap:3cqw}
.cell:has(.rl) .notes{top:30cqw}
.notes i{display:grid;place-items:center;width:var(--ns);height:var(--ns);border-radius:22%;background:var(--c);color:#fff;font:700 calc(var(--ns)*.6)/1 Inter,sans-serif;font-style:normal;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.cell.noted .ico{opacity:.3}
.mk{position:absolute;left:22%;top:22%;width:56%;height:56%;pointer-events:none;color:color-mix(in srgb,var(--wall) 60%,transparent)}
.mk.auto{left:32%;top:32%;width:36%;height:36%;color:color-mix(in srgb,var(--wall) 32%,transparent)}
.msep{height:1px;background:var(--line);margin:6px 4px}
#autoBtn span{flex:1}
.sw2{flex:none;position:relative;width:40px;height:24px;border-radius:999px;background:var(--line);transition:background .15s}
.sw2::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
#autoBtn[aria-checked=true] .sw2{background:#1f9a55}
#autoBtn[aria-checked=true] .sw2::after{transform:translateX(16px)}
.face{--c:#888;display:block;width:76%;aspect-ratio:1;border-radius:50%;overflow:hidden;background:var(--c);box-shadow:0 0 0 2.5px var(--bg),0 6px 10px -4px rgba(0,0,0,.45);position:relative;z-index:2;pointer-events:none}
.face svg{display:block;width:100%;height:100%}
.cell .face{animation:pop .22s ease-out}
.face.bad{box-shadow:0 0 0 3px var(--hot),0 0 0 6px color-mix(in srgb,var(--hot) 30%,transparent)}
.face.sel{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--ink)}
.badge{position:absolute;bottom:2px;left:50%;transform:translateX(-50%);background:var(--alarm);color:#fff;font:700 11px/1 Inter,sans-serif;padding:3px 7px;border-radius:999px;z-index:4;pointer-events:none;white-space:nowrap}
@keyframes pop{from{transform:scale(.5);opacity:.2}}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.shake{animation:shake .25s 2}
.side{display:grid;gap:22px}
h2{font:700 22px/1.1 Outfit,sans-serif;margin:0 0 12px;letter-spacing:-.01em}
.tray{display:flex;flex-wrap:wrap;gap:6px}
.pick{display:grid;justify-items:center;gap:6px;border:0;background:none;padding:8px 4px;width:72px;border-radius:16px;position:relative}
.pick .face{width:52px;box-shadow:0 0 0 2.5px var(--bg),0 6px 10px -5px rgba(0,0,0,.4)}
.pick>span:last-child{font-size:14px;font-weight:600}
.pick:hover{background:var(--card)}
.pick.on{background:var(--card)}
.pick.on .face{box-shadow:0 0 0 2.5px var(--bg),0 0 0 5px var(--ink)}
.pick.done .face{opacity:.55}
.ok{position:absolute;top:4px;right:calc(50% - 30px);width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:0 0 0 2px var(--bg);z-index:3}
.ok svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.people-row{margin-top:16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.focus{--pc:var(--soft);display:flex;gap:14px;align-items:center;margin-top:8px;padding:12px 16px 12px 12px;border-radius:20px;background:color-mix(in srgb,var(--pc) 13%,var(--bg));border:1.5px solid color-mix(in srgb,var(--pc) 38%,transparent);color:var(--ink);min-height:76px}
.focus .face{width:52px;flex:none;box-shadow:0 0 0 2.5px var(--ink);animation:none}
.focus b{display:block;font:700 18px/1.2 Outfit,sans-serif}
.focus .q{display:block;font-size:16px;line-height:1.35}
.focus .h{display:block;font-size:13px;color:var(--soft);margin-top:2px}
.focus.accuse b,.focus.done b{display:block;font:700 17px/1.25 Outfit,sans-serif}
.focus.done{background:var(--card);border-color:transparent;flex-direction:column;align-items:stretch;gap:0;padding:18px}
.focus.done .tag{align-self:flex-start;margin:0 0 12px}
.focus.done b{font:700 22px/1.2 Outfit,sans-serif;margin:0 0 4px}
.focus.done .h{font-size:15px;line-height:1.45;margin:0}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 16px}
.stats span{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:999px;background:var(--bg);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.stats svg{width:16px;height:16px;color:var(--soft)}
.focus.done .btn{width:100%;min-height:50px;font-size:16px}
.focus.idle{background:var(--card);border-color:transparent;color:var(--soft)}
.people{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pc{display:flex;align-items:stretch;border:1.5px solid var(--line);border-radius:18px;background:var(--bg);transition:border-color .15s,background .15s}
.pbtn{flex:1;display:flex;gap:12px;align-items:center;border:0;background:none;text-align:left;padding:8px 6px 8px 8px;min-height:62px;border-radius:16px}
.pbtn .face{width:46px;flex:none;animation:none}
.pt b{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-weight:600}
.pt .t{display:block;line-height:1.35}
.st{font:600 12px/1 Inter,sans-serif;background:var(--card);color:var(--soft);padding:4px 8px;border-radius:999px}
.pc:hover{border-color:color-mix(in srgb,var(--ink) 40%,var(--line))}
.pc.on{border-color:var(--ink);background:var(--card)}
.pc.on .st{background:var(--bg)}
.pc.rel{border-color:var(--ink);border-style:dashed}
.pc.x .t{text-decoration:line-through;color:var(--soft)}
.pc.x .pbtn .face{opacity:.5}
.chk{flex:none;width:52px;border:0;background:none;display:grid;place-items:center;border-radius:16px}
.chk svg{width:26px;height:26px}
.chk circle{fill:none;stroke:var(--line);stroke-width:2}
.chk path{stroke:transparent}
.chk[aria-pressed=true] circle{fill:var(--ink);stroke:var(--ink)}
.chk[aria-pressed=true] path{stroke:var(--bg)}
.chk:hover circle{stroke:var(--ink)}
.focus>span{flex:1}
.rule{margin:0!important}
.toolbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:12px}
.morewrap{position:relative;display:grid}
.morewrap>.tb{border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.morewrap>.tb[aria-expanded=true]{border-color:var(--ink);background:var(--card)}
.menu{position:absolute;right:0;bottom:calc(100% + 8px);z-index:20;min-width:190px;padding:6px;border-radius:16px;background:var(--bg);box-shadow:0 0 0 1px var(--line),0 16px 32px -10px rgba(0,0,0,.35)}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:0 12px;border:0;border-radius:10px;background:none;font-weight:600;font-size:15px;color:var(--ink);text-align:left;white-space:nowrap}
.menu button:hover,.menu button:focus-visible{background:var(--card)}
.menu svg{width:20px;height:20px;flex:none}
.seg{grid-column:span 3;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px;padding:3px;background:var(--card);border-radius:16px}
.tb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:58px;padding:0 2px;border:0;border-radius:13px;background:none;font-weight:600;font-size:13px;color:var(--soft);white-space:nowrap}
.tb svg{width:22px;height:22px;flex:none}
.seg .tb[aria-pressed=true]{background:light-dark(#ffffff,#2c2d36);color:var(--ink);box-shadow:0 0 0 1.5px light-dark(#d9d9e1,#40414c),0 2px 6px -2px rgba(0,0,0,.25)}
.toolbar>.tb{border:1.5px solid var(--line);border-radius:16px;background:var(--bg);color:var(--ink)}
.toolbar>.tb:hover{border-color:var(--ink)}
.rule{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--hot) 10%,var(--bg));border:1.5px solid color-mix(in srgb,var(--hot) 40%,transparent);border-radius:16px;padding:12px 14px;margin:0 0 10px;font-weight:500;line-height:1.4}
.rule svg{width:28px;height:28px;flex:none;color:var(--hot)}
.clues{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.clues button{width:100%;text-align:left;display:flex;gap:12px;align-items:center;padding:8px 14px 8px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);min-height:52px;line-height:1.35;transition:border-color .15s,background .15s}
.clues .face{width:36px;flex:none;box-shadow:none;animation:none}
.clues li.hl button{border-color:var(--ink);background:var(--card)}
.clues li.x button{color:var(--soft)}
.clues li.x .t{text-decoration:line-through}
.clues li.x .face{opacity:.45}
.toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;max-width:min(92vw,460px);opacity:0;transition:.25s;pointer-events:none;z-index:20;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.tip{position:absolute;z-index:30;max-width:min(260px,80vw);background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;line-height:1.35;padding:8px 12px;border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:opacity .15s}
.tip.show{opacity:1}
.tip::after{content:'';position:absolute;left:var(--ax);transform:translateX(-50%);bottom:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:6px solid var(--ink)}
.tip.below::after{bottom:auto;top:-6px;border-top:0;border-bottom:6px solid var(--ink)}
.toast.show{opacity:1;transform:translate(-50%,0)}
dialog{border:0;border-radius:24px;padding:0;width:min(92vw,540px);max-height:min(88svh,820px);overflow:auto;background:var(--bg);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.4)}
dialog::backdrop{background:rgba(10,10,16,.55);backdrop-filter:blur(3px)}
.dlg{padding:24px}
.dlg h3{font:800 28px/1.1 Outfit,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
.dlg ol{padding-left:20px;margin:8px 0 14px}
.dlg li{margin-bottom:6px}
.dlg p{margin:0 0 12px}
.grab{display:none}
.grabbar{display:none}
.ver{margin-top:4px!important}
.intro{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center;margin:0 0 4px}
.intro .face{width:68px;box-shadow:none}
.intro p{margin:0;color:var(--soft)}
.dlg .steps{list-style:none;padding:0;margin:16px 0 24px;display:grid;gap:14px;counter-reset:st}
.steps li{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center}
.ill{width:68px;height:68px;border-radius:18px;background:var(--card);position:relative;overflow:hidden}
.ill svg{display:block;width:100%;height:100%}
.ill .face{position:absolute;width:30px;box-shadow:0 0 0 2px var(--card);animation:none}
.steps b{display:block;font:700 17px/1.25 Outfit,sans-serif}
.steps b::before{counter-increment:st;content:counter(st) '. ';color:var(--soft)}
.steps p{margin:2px 0 0!important;color:var(--soft);font-size:15px;line-height:1.4}
.dlg h4{font:700 19px/1.2 Outfit,sans-serif;margin:0 0 12px}
.dlg h3{margin-bottom:14px}
.ctrl{display:grid;gap:12px;margin:0 0 20px}
.ctrl div{display:grid;grid-template-columns:68px minmax(0,1fr);gap:14px;align-items:center}
.ctrl i{width:68px;height:48px;border-radius:14px;background:var(--card);display:grid;place-items:center}
.ctrl i svg{width:22px;height:22px}
.ctrl b{display:block;font-weight:600;font-size:15px;line-height:1.2;color:var(--ink);margin-bottom:2px}
.dlg h3:focus{outline:none}
.ctrl span{display:block;font-size:14px;color:var(--soft);line-height:1.35}
.furn{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 10px}
.furn span{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px 0 8px;border-radius:999px;background:var(--card);font-weight:600;font-size:14px}
.furn svg{width:24px;height:24px}
.furn .no{background:repeating-linear-gradient(-45deg,var(--card) 0 6px,color-mix(in srgb,var(--card) 72%,var(--soft)) 6px 7px)}
.furn .rugsw{display:inline-block;width:20px;height:16px;margin:0 2px}
.note{color:var(--soft);font-size:15px;margin:0 0 20px!important}
.cta{width:100%;min-height:52px;font-size:16px}
.ver{text-align:center;color:var(--soft);font-size:13px;margin:12px 0 0!important}
.row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.choices{display:grid;gap:8px}
.choices button{display:grid;grid-template-columns:28px minmax(0,1fr) auto;align-items:center;gap:14px;min-height:60px;padding:0 18px 0 14px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);font-weight:600;font-size:16px;text-align:left}
.choices .lvl{width:28px;height:28px;color:var(--ink)}
.choices button:hover .lvl{color:var(--ink)}
.dlg .sub{color:var(--soft);margin:0 0 16px}
.seg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3px;padding:3px;background:var(--card);border-radius:16px;margin:0 0 18px}

  return `<svg viewBox="0 0 64 64" aria-hidden="true"><g fill="${L.hair}">${L.back||''}</g><path d="M11 66c0-13 9.5-19.5 21-19.5S53 53 53 66z" fill="${L.shirt}"/><rect x="27" y="38" width="10" height="11" rx="4" fill="${L.skin}"/><rect x="27" y="40" width="10" height="4" fill="#000" opacity=".1"/><ellipse cx="32" cy="30" rx="13.2" ry="15" fill="${L.skin}"/><ellipse cx="18.8" cy="31.5" rx="2" ry="3" fill="${L.skin}"/><ellipse cx="45.2" cy="31.5" rx="2" ry="3" fill="${L.skin}"/><g fill="${L.hair}">${L.front||''}</g>${L.extra||''}</svg>`;
}
function face(p,cls=''){const per=pz.people[p];return `<span class="face ${cls}" style="--c:${per.col}">${faceSvg(per.name)}</span>`}

function save(){try{localStorage.setItem(LS,JSON.stringify(state))}catch(e){}}
function loadSaved(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
const tipEl=document.createElement('div');tipEl.className='tip';tipEl.setAttribute('role','status');document.body.appendChild(tipEl);let tipT=0;
// tekstballon direct bij het vakje
function bubble(c,text){
  const el=board.querySelector(`[data-c="${c}"]`);if(!el){toast(text);return}
  tipEl.textContent=text;tipEl.classList.remove('below');tipEl.style.left='0px';tipEl.style.top='0px';
  const r=el.getBoundingClientRect(),t=tipEl.getBoundingClientRect();
  const x=Math.max(8,Math.min(r.left+r.width/2-t.width/2,innerWidth-t.width-8));
  const bt=board.getBoundingClientRect().top;let y=r.top-t.height-10,below=false;if(y<Math.max(8,bt-4)){y=r.bottom+10;below=true}
  tipEl.classList.toggle('below',below);
  tipEl.style.left=(x+scrollX)+'px';tipEl.style.top=(y+scrollY)+'px';
  tipEl.style.setProperty('--ax',(r.left+r.width/2-x)+'px');
  tipEl.classList.add('show');clearTimeout(tipT);tipT=setTimeout(()=>tipEl.classList.remove('show'),2600);
}
addEventListener('scroll',()=>tipEl.classList.remove('show'),{passive:true});
function toast(t,ms){const el=$('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),ms||2800)}
function roomName(i){return pz.names[i][1]+' '+pz.names[i][0]}
function cap(s){return s[0].toUpperCase()+s.slice(1)}
function cellDesc(c){const o=pz.obj[c],rn=roomName(pz.room[c]);return o?`${cap(OBJ[o][1])} ${rn}`:`Een leeg vakje ${rn}`}
function placedText(p,c){const o=pz.obj[c],rn=roomName(pz.room[c]),nm=pz.people[p].name,v=p===pz.V;
  if(o==='stoel')return `${nm} zit op een stoel ${rn}.`;if(o==='bed')return `${nm} ligt op een bed ${rn}.`;
  if(o==='kleed')return `${nm} ${v?'ligt':'staat'} op een kleed ${rn}.`;return `${nm} ${v?'ligt':'staat'} ${rn}.`}

function start(diff,seed,saved){
  seed=Number.isFinite(seed)&&seed>0?Math.floor(seed):1000+Math.floor(Math.random()*9000);
  document.body.classList.add('busy');
  setTimeout(()=>{
    const g=generate(seed,diff);
    document.body.classList.remove('busy');
    if(!g){toast('Deze zaak lukt niet. Probeer een ander nummer.');return}
    pz=g;
    state=saved||{seed,diff,place:Array(pz.n).fill(-1),marks:[],notes:{},struck:[],hints:0,elapsed:0,solved:false,closed:false,sel:0};
    undo=[];hlRoom=-1;render();save();
  },30);
}
function push(){undo.push(JSON.stringify({place:state.place,marks:state.marks,notes:state.notes||{}}));if(undo.length>200)undo.shift()}


function render(){
  const {n,room,obj,people,V}=pz;
  board.style.setProperty('--n',n);
  $('#case').innerHTML=`<span class="zk">Zaak </span><b>${codeOf(state.seed,state.diff)}</b> · ${DIFF[state.diff].label}`;
  $('#time').textContent=fmt(state.elapsed);
  // Kamernaam: eerst een plek waar de naam past, dan bij voorkeur in lege vakjes, zo hoog mogelijk

  // kamernaam: altijd in een leeg vakje; daarna liefst met ruimte ernaast, zo hoog mogelijk
  const best={};
  for(let c=0;c<n*n;c++){
    const r=Math.floor(c/n),k=c%n,rm=room[c],short=pz.names[rm][0].length<=4;
    let w=0;while(k+w<n&&room[c+w]===rm)w++;
    let f=0;while(k+f<n&&room[c+f]===rm&&!obj[c+f])f++;
    const taken=state.place.includes(c)||(k<n-1&&!short&&state.place.includes(c+1));
    const sc=(obj[c]?0:300)+(taken?-400:0)+(f>=2||(short&&f>=1)?100:0)+(w>=2||short?50:0)+Math.min(w,3)*5-r;
    if(!best[rm]||sc>best[rm].sc)best[rm]={c,len:w,sc};
  }
  const autoSet=new Set();
  if(autoX&&!state.closed)state.place.forEach(pc=>{if(pc<0)return;const pr=Math.floor(pc/n),pk=pc%n;
    for(let q=0;q<n;q++){autoSet.add(pr*n+q);autoSet.add(q*n+pk)}});
  const rowC=Array(n).fill(0),colC=Array(n).fill(0);
  state.place.forEach(c=>{if(c>=0){rowC[Math.floor(c/n)]++;colC[c%n]++}});
  let h='';
  for(let c=0;c<n*n;c++){
    const r=Math.floor(c/n),k=c%n,o=obj[c],p=state.place.indexOf(c);
    const cls=['cell','r'+room[c]];
    if(o==='kleed')cls.push('kleed');
    if(BLOCK[o])cls.push('blk');
    if(p>=0)cls.push('has');
    let inner='';
    if(best[room[c]].c===c)inner+=`<span class="rl" data-len="${best[room[c]].len}" style="max-width:calc(${best[room[c]].len*100}% - 8px)">${cap(pz.names[room[c]][0])}</span>`;
    if(o&&o!=='kleed')inner+=`<svg class="ico" aria-hidden="true"><use href="#i-${o}"/></svg>`;
    if(p<0&&state.marks.includes(c))inner+=`<svg class="mk" aria-hidden="true"><use href="#i-x"/></svg>`;
    else if(p<0&&autoSet.has(c)&&!BLOCK[o])inner+=`<svg class="mk auto" aria-hidden="true"><use href="#i-x"/></svg>`;
    const nt=p<0&&state.notes&&state.notes[c];if(nt&&nt.length){cls.push('noted');inner+=`<span class="notes${nt.length>4?' l':nt.length>2?' m':''}" aria-hidden="true">${nt.map(q=>`<i style="--c:${people[q].col}">${people[q].name[0]}</i>`).join('')}</span>`}
    if(p>=0){
      const bad=rowC[r]>1||colC[k]>1;
      inner+=face(p,(bad?'bad ':'')+(p===state.sel&&!state.closed?'sel':''));
      if(state.closed&&p===pz.murderer)inner+='<span class="badge">Dader</span>';
    }
    const label=`Rij ${r+1}, kolom ${k+1}, ${pz.names[room[c]][0]}${o?', '+OBJ[o][0]:''}${p>=0?', '+people[p].name:''}${p<0&&state.notes&&state.notes[c]&&state.notes[c].length?', notities: '+state.notes[c].map(q=>people[q].name).join(', '):''}`;
    h+=`<button type="button" class="${cls.join(' ')}" data-c="${c}" aria-label="${label}">${inner}</button>`;
  }
  let wd='';
  for(let c=0;c<n*n;c++){const r=Math.floor(c/n),k=c%n;if(r>0&&room[c]!==room[c-n])wd+=`M${k} ${r}h1`;if(k>0&&room[c]!==room[c-1])wd+=`M${k} ${r}v1`}
  h+=`<svg class="walls" viewBox="0 0 ${n} ${n}" preserveAspectRatio="none" aria-hidden="true"><path d="${wd}"/></svg>`;
  board.innerHTML=h;
  board.querySelectorAll('.rl').forEach(l=>{const cw=l.parentElement.clientWidth,tw=l.scrollWidth;if(tw<=cw-12){l.classList.add('ctr');return}
    const span=Math.min(+l.dataset.len,Math.ceil((tw+12)/cw));if(span>1&&tw<=span*cw-12){l.style.left=Math.round((span*cw-tw)/2)+'px';return}if(l.scrollWidth>l.clientWidth)l.classList.add('sm');if(l.scrollWidth>l.clientWidth){l.style.maxWidth='none';l.classList.add('over')}});
  const S=state.sel,sc=S>=0?pz.clues.find(c=>c.p===S):null;
  const picking=state.solved&&!state.closed;
  tray.innerHTML=people.map((per,p)=>`<button type="button" class="pick${p===S?' on':''}${state.place[p]>=0&&!picking?' done':''}" data-p="${p}" aria-pressed="${p===S}">${face(p)}${state.place[p]>=0&&!picking?'<span class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9"/></svg></span>':''}<span>${per.name}</span></button>`).join('');
  const F=$('#focus');
  if(state.closed){const t=state.hints;F.className='focus done';F.innerHTML=`<span class="tag">Zaak gesloten</span><b>${people[pz.murderer].name} was het!</b><span class="h">${people[pz.murderer].name} was als enige verdachte samen met ${people[V].name} ${roomName(room[pz.sol[V]])}.</span><span class="stats"><span>${IC.clock}${fmt(state.elapsed)}</span><span>${IC.tip}${t?`${t} tip${t>1?'s':''}`:'Zonder tips'}</span></span><button type="button" class="btn main" data-new>Nieuwe zaak</button>`}
  else if(state.solved){F.className='focus accuse';F.innerHTML=`<span><b>Iedereen staat goed!</b><span class="h">${accMsg||`Wie heeft ${people[V].name} vermoord? Tik op de dader, hieronder of op het bord.`}</span></span>`}
  else if(S>=0){F.className='focus';F.innerHTML=`${face(S)}<span><span class="q">${clueText(pz,sc)}</span><span class="h">${mode==='potlood'?`Tik op vakjes waar ${people[S].name} zou kunnen staan.`:mode==='kruis'?`Kies ‘Persoon’ om ${people[S].name} neer te zetten.`:state.place[S]>=0?`Tik op een ander vakje om ${people[S].name} te verplaatsen, of op hetzelfde vakje om ${people[S].name} weg te halen.`:`Tik op een vakje om ${people[S].name} neer te zetten.`}</span></span>`}
  else{F.className='focus idle';F.innerHTML=`<span><span class="q">${mode==='kruis'?'Tik op vakjes waar volgens jou niemand stond.':mode==='potlood'?'Tik eerst op een persoon, daarna op de vakjes waar die zou kunnen staan.':'Tik op een persoon om de aanwijzing te zien.'}</span></span>`}
  if(state.solved&&!state.closed)F.style.setProperty('--pc','var(--alarm)');else if(!state.closed&&S>=0)F.style.setProperty('--pc',people[S].col);else F.style.removeProperty('--pc');
  $('#mPlace').setAttribute('aria-pressed',mode==='plaats');
  $('#mMark').setAttribute('aria-pressed',mode==='kruis');
  $('#mNote').setAttribute('aria-pressed',mode==='potlood');
  $('#autoBtn').setAttribute('aria-checked',autoX);
}

function after(){
  render();save();
  if(state.solved)return;
  const {n,sol}=pz;
  if(state.place.every(c=>c>=0)){
    if(state.place.every((c,p)=>c===sol[p])){state.solved=true;state.sel=-1;accMsg='';save();render()}
    else{
      const rows=new Set(state.place.map(c=>Math.floor(c/n))),cols=new Set(state.place.map(c=>c%n));
      toast(rows.size<n||cols.size<n?'Er staan nog twee mensen in dezelfde rij of kolom.':'Iedereen staat, maar er klopt nog iets niet. Loop de aanwijzingen nog eens na.');
    }
  }
}

board.addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b||!state||state.closed)return;
  const c=+b.dataset.c,occ=state.place.indexOf(c);
  if(state.solved){if(occ>=0)accuse(occ);else bubble(c,`${cellDesc(c)}. Tik op de dader.`);return}
  if(occ>=0&&occ!==state.sel&&mode!=='kruis'){state.sel=occ;render();save();return}
  if(mode==='potlood'){
    if(occ>=0){bubble(c,'Hier staat al iemand.');return}
    if(BLOCK[pz.obj[c]]){bubble(c,`${cellDesc(c)}: hier kan niemand staan.`);return}
    if(state.sel<0){bubble(c,'Tik eerst op een persoon om een notitie te maken.');return}
    push();if(!state.notes)state.notes={};const L=state.notes[c]||(state.notes[c]=[]),x=L.indexOf(state.sel);
    if(x>=0)L.splice(x,1);else{L.push(state.sel);L.sort((a,b)=>a-b)}
    if(!L.length)delete state.notes[c];after();return;
  }
  if(mode==='kruis'){
    if(occ>=0){bubble(c,'Haal eerst de persoon van dit vakje.');return}
    if(BLOCK[pz.obj[c]]){bubble(c,`${cellDesc(c)}: hier kan sowieso niemand staan.`);return}
    push();const i=state.marks.indexOf(c);i>=0?state.marks.splice(i,1):state.marks.push(c);after();return;
  }
  if(BLOCK[pz.obj[c]]){b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),520);bubble(c,`${cellDesc(c)}: hier kan niemand staan.`);return}
  if(state.sel<0){bubble(c,`${cellDesc(c)}. Tik eerst op een persoon om iemand neer te zetten.`);return}
  push();
  const s=state.sel;let pb=null;
  if(state.place[s]===c){state.place[s]=-1}
  else{
    if(occ>=0)state.place[occ]=-1;
    state.place[s]=c;
    state.marks=state.marks.filter(m=>m!==c);
    pb=placedText(s,c);
    let next=-1;
    for(let i=1;i<=pz.n;i++){const q=(s+i)%pz.n;if(state.place[q]<0){next=q;break}}
    state.sel=next;
  }
  after();
  if(pb&&!document.querySelector('dialog[open]'))bubble(c,pb);
});
tray.addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b||state.closed)return;if(state.solved){accuse(+b.dataset.p);return}const p=+b.dataset.p;state.sel=state.sel===p?-1:p;if(mode==='kruis')mode='plaats';render();save()});
$('#mPlace').addEventListener('click',()=>{mode='plaats';render()});
$('#mMark').addEventListener('click',()=>{mode='kruis';if(state)state.sel=-1;render();save()});
$('#mNote').addEventListener('click',()=>{mode='potlood';render()});

function setMenu(open){moreMenu.hidden=!open;moreBtn.setAttribute('aria-expanded',open);if(open)moreMenu.querySelector('button').focus()}

  if(e.target.closest('#autoBtn')){autoX=!autoX;try{localStorage.setItem('murdoku-auto',autoX?'1':'0')}catch(err){}render();return}
  setMenu(false)});

$('#undoBtn').addEventListener('click',()=>{if(state.closed||!undo.length){toast('Er is niets om ongedaan te maken.');return}const u=JSON.parse(undo.pop());state.place=u.place;state.marks=u.marks;state.notes=u.notes||{};state.solved=false;render();save()});
$('#clearBtn').addEventListener('click',()=>{if(state.closed)return;push();state.place=state.place.map(()=>-1);state.marks=[];state.notes={};state.sel=0;after();toast('Het bord is leeg. Met Terug zet je alles weer terug.')});
$('#hintBtn').addEventListener('click',()=>{
  if(state.closed)return;
  if(state.solved){toast('Iedereen staat goed. Tik op de dader.');return}
  const {sol,people}=pz;push();state.hints++;
  const wrong=state.place.findIndex((c,p)=>c>=0&&c!==sol[p]);
  if(wrong>=0){state.place[wrong]=-1;state.sel=wrong;toast(`${people[wrong].name} stond op de verkeerde plek. Ik heb ${people[wrong].name} van het bord gehaald.`)}
  else{const p=state.place.findIndex(c=>c<0);const c=sol[p];const occ=state.place.indexOf(c);if(occ>=0)state.place[occ]=-1;state.place[p]=c;state.marks=state.marks.filter(m=>m!==c);if(state.notes)delete state.notes[c];state.sel=state.place.findIndex(x=>x<0);toast(`${people[p].name} staat nu op de juiste plek.`)}
  after();
});

function accuse(p){
  const {people,V,murderer}=pz;
  if(p===V)accMsg=`${people[V].name} is het slachtoffer. Wie stond als enige verdachte bij ${people[V].name} in de kamer?`;
  else if(p!==murderer)accMsg=`Nee, ${people[p].name} heeft een alibi. Kijk wie als enige verdachte bij ${people[V].name} in de kamer staat.`;
  else{state.closed=true;state.sel=-1;save()}
  render();
}

function swipeToClose(d){
  let y0=null,dy=0,t0=0;
  d.addEventListener('click',e=>{if(e.target===d)d.close()});
  d.addEventListener('touchstart',e=>{if(d.scrollTop>2&&!e.target.closest('.grabbar')){y0=null;return}y0=e.touches[0].clientY;dy=0;t0=Date.now();d.style.transition='none'},{passive:true});
  d.addEventListener('touchmove',e=>{if(y0===null)return;dy=Math.max(0,e.touches[0].clientY-y0);d.style.transform=dy?`translateY(${dy}px)`:'';if(dy>0&&e.cancelable)e.preventDefault()},{passive:false});
  d.addEventListener('touchend',()=>{if(y0===null)return;y0=null;const v=dy/Math.max(1,Date.now()-t0);d.style.transition='transform .22s ease';
    if(dy>110||(v>.5&&dy>40)){d.style.transform='translateY(110%)';setTimeout(()=>{d.close();d.style.transform='';d.style.transition=''},220)}
    else d.style.transform=''});
}
document.querySelectorAll('dialog').forEach(swipeToClose);
$('#rulesBtn').addEventListener('click',()=>{$('#rulesDlg').showModal();$('#rulesDlg').scrollTop=0});
let newMode='solo';
// zaaknummer = niveaucijfer + startgetal, bv. 21213 = Gemiddeld, 1213
const LVL={makkelijk:'1',gemiddeld:'2',moeilijk:'3'},LVLR={1:'makkelijk',2:'gemiddeld',3:'moeilijk'};
const codeOf=(seed,diff)=>LVL[diff]+seed;
const rndSeed=()=>1000+Math.floor(Math.random()*9000);
function setNewMode(m){newMode=m;document.querySelectorAll('.seg2 button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));
  $('#paneSolo').classList.toggle('off',m!=='solo');$('#paneSamen').classList.toggle('off',m!=='samen')}
function openNew(){pending=null;showView('choose');$('#joinIn').value='';$('#joinMsg').textContent='';setNewMode(newMode);$('#newDlg').showModal();$('#newDlg').scrollTop=0}
document.querySelector('.seg2').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setNewMode(b.dataset.mode)});
$('#newBtn').addEventListener('click',openNew);
function join(){
  const v=$('#joinIn').value.replace(/\D/g,''),d=LVLR[v[0]],sd=parseInt(v.slice(1),10);
  if(v.length<5||!d||!(sd>0)){$('#joinMsg').textContent='Een zaaknummer heeft vijf cijfers en begint met 1, 2 of 3.';$('#joinIn').focus();return}
  $('#newDlg').close();mode='plaats';start(d,sd);
}
$('#joinBtn').addEventListener('click',join);
// deelscherm
const APP_URL='https://rserne.github.io/murdoku/';
let shareCode='',shareDiff='',pending=null;
function showView(v){const sh=v==='share';$('#vChoose').classList.toggle('off',sh);$('#vShare').classList.toggle('off',!sh);
  $('#vChoose').toggleAttribute('aria-hidden',sh);$('#vShare').toggleAttribute('aria-hidden',!sh);$('#newDlg').scrollTop=0}
function fillShare(code,diff){shareCode=code;shareDiff=diff;
  $('#shareDigits').innerHTML=[...code].map(c=>`<span>${c}</span>`).join('');
  $('#shareSub').textContent=`${DIFF[diff].label}. Je vriend kiest bij Nieuwe zaak voor Samen en vult dit nummer in bij Meedoen.`}
function openShare(){pending=null;fillShare(codeOf(state.seed,state.diff),state.diff);$('#goBtn').textContent='Terug naar de zaak';showView('share');$('#newDlg').showModal();$('#newDlg').scrollTop=0}
$('#case').addEventListener('click',()=>{if(state)openShare()});
$('#goBtn').addEventListener('click',()=>$('#newDlg').close());
// een gekozen zaak start pas als het venster dicht is, dus niets beweegt erachter
$('#newDlg').addEventListener('close',()=>{if(pending){const p=pending;pending=null;mode='plaats';start(p.d,p.sd)}});
$('#shareBtn').addEventListener('click',async()=>{
  const code=shareCode,url=APP_URL+'#zaak-'+code;
  const text=`Los je samen met mij een moord op? Murdoku, zaak ${code} (${DIFF[shareDiff].label}). Open de link, of kies Nieuwe zaak › Samen › Meedoen en vul ${code} in.`;
  try{if(navigator.share){await navigator.share({title:'Murdoku',text,url});return}}catch(e){if(e&&e.name==='AbortError')return}
  try{await navigator.clipboard.writeText(text+' '+url);toast('Uitnodiging gekopieerd. Plak hem in een bericht aan je vriend.')}
  catch(e){toast(`Stuur je vriend het zaaknummer ${code}.`)}
});
$('#joinIn').addEventListener('keydown',e=>{if(e.key==='Enter')join()});
$('#joinIn').addEventListener('input',()=>{$('#joinMsg').textContent=''});
$('#newDlg').addEventListener('click',e=>{
  const a=e.target.closest('[data-diff]'),b=e.target.closest('[data-start]');if(!a&&!b)return;
  if(a){$('#newDlg').close();mode='plaats';start(a.dataset.diff);return}
  const d=b.dataset.start,sd=rndSeed();pending={d,sd};
  fillShare(codeOf(sd,d),d);$('#goBtn').textContent='Start de zaak';showView('share');
});

setInterval(()=>{if(state&&!state.closed&&!document.hidden&&!document.querySelector('dialog[open]')){state.elapsed++;$('#time').textContent=fmt(state.elapsed);if(state.elapsed%5===0)save()}},1000);

const IC={
  pencil:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1-4.5L15.5 5a2.1 2.1 0 0 1 3 0l.5.5a2.1 2.1 0 0 1 0 3L8.5 19z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M13.5 7l3.5 3.5" stroke="currentColor" stroke-width="2"/></svg>',
  more:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5.5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="18.5" cy="12" r="1.8" fill="currentColor"/></svg>',
  clock:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  person:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="currentColor"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7z" fill="currentColor"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>',
  undo:'<svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4.5 12H14a6 6 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 -3)"/></svg>',
  tip:'<svg viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9.5 19.5h5M10.5 22h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  rooms:'<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5V13H20.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>'
};
function fc(name,col,style){return `<span class="face" style="--c:${col};${style||''}">${faceSvg(name)}</span>`}
function renderRules(){
  const [A,B,C]=[PEOPLE[0],PEOPLE[1],PEOPLE[3]],V=VICTIM;
  const dots=[[32,14.7,'#1d6fd1'],[49.3,32,'#e0711b'],[14.7,49.3,'#8a3fc4']].map(([x,y,c])=>`<circle cx="${x}" cy="${y}" r="6.5" fill="${c}"/>`).join('');
  $('#rulesBody').innerHTML=`<div class="grabbar"><div class="grab"></div></div>
  <h3 id="rulesTitle" tabindex="-1" autofocus>Zo speel je Murdoku</h3>
  <div class="intro">${fc(V[0],V[1])}<p>Iemand heeft Vincent vermoord. Zet iedereen op de plattegrond en ontmasker de dader.</p></div>
  <ol class="steps">
    <li><div class="ill">${fc(A[0],A[1],'left:6px;top:8px')}${fc(B[0],B[1],'left:30px;top:16px')}${fc(V[0],V[1],'left:15px;top:32px')}</div><div><b>Iedereen moet op het bord</b><p>De verdachten én Vincent.</p></div></li>
    <li><div class="ill"><svg viewBox="0 0 64 64"><g fill="none" stroke="var(--soft)" stroke-width="1.4" opacity=".6"><rect x="6" y="6" width="52" height="52" rx="5"/><path d="M23.3 6v52M40.6 6v52M6 23.3h52M6 40.6h52"/></g>${dots}</svg></div><div><b>Eén persoon per rij en kolom</b><p>Net als de cijfers in een sudoku.</p></div></li>
    <li><div class="ill" style="background:repeating-linear-gradient(-45deg,var(--card) 0 6px,color-mix(in srgb,var(--card) 70%,var(--soft)) 6px 7px)"><svg viewBox="0 0 64 64"><use href="#i-plant" x="5" y="8" width="28" height="28"/><use href="#i-kast" x="31" y="28" width="28" height="28"/></svg></div><div><b>Niet op planten en kasten</b><p>Op stoelen, bedden en kleden mag je wel staan.</p></div></li>
    <li><div class="ill"><svg viewBox="0 0 64 64"><rect x="6" y="6" width="52" height="26" fill="var(--r3)"/><rect x="6" y="32" width="52" height="26" fill="var(--r0)"/><path d="M6 32h52" stroke="var(--wall)" stroke-width="3"/><use href="#i-stoel" x="9" y="9" width="20" height="20"/><circle cx="45" cy="19" r="8" fill="#1d6fd1"/><use href="#i-plant" x="35" y="35" width="20" height="20"/><path d="M28 19h6" stroke="#1f9a55" stroke-width="2.4" stroke-linecap="round"/><path d="M45 29v6" stroke="var(--alarm)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="2 3"/></svg></div><div><b>Elke aanwijzing klopt</b><p>‘Naast’ is direct links, rechts, boven of onder, in dezelfde kamer. Door een muur heen telt niet.</p></div></li>
    <li><div class="ill"><svg viewBox="0 0 64 64"><rect x="4" y="4" width="38" height="56" rx="6" fill="var(--r2)"/><path d="M42 4v56" stroke="var(--wall)" stroke-width="3"/></svg>${fc(V[0],V[1],'left:9px;top:8px')}${fc(C[0],C[1],'left:9px;top:34px')}${fc(B[0],B[1],'left:44px;top:20px;width:20px;opacity:.6')}</div><div><b>De dader was alleen met Vincent</b><p>De enige verdachte in dezelfde kamer als Vincent heeft het gedaan.</p></div></li>
  </ol>
  <h4>Meubels</h4>
  <div class="furn"><span><svg><use href="#i-stoel"/></svg>Stoel</span><span><svg><use href="#i-bed"/></svg>Bed</span><span><i class="rugsw"></i>Kleed</span><span class="no"><svg><use href="#i-plant"/></svg>Plant</span><span class="no"><svg><use href="#i-kast"/></svg>Boekenkast</span></div>
  <p class="note">Op een stoel, bed of kleed mag iemand staan. Op een plant of boekenkast niet: die vakjes zijn gearceerd. Tik op een vakje om te zien wat er staat.</p>
  <h4>Bediening</h4>
  <div class="ctrl">
    <div><i>${IC.person}</i><span><b>Persoon</b>Tik op een gezicht en daarna op een vakje.</span></div>
    <div><i>${IC.pencil}</i><span><b>Potlood</b>Kies een persoon en tik op vakjes waar die zou kunnen staan. Er verschijnt een kleine letter.</span></div>
    <div><i>${IC.x}</i><span><b>Kruisje</b>Markeer vakjes waar niemand stond.</span></div>
    <div><i>${IC.tip}</i><span><b>Tip</b>Haal een fout weg of zet iemand goed.</span></div>
    <div><i>${IC.more}</i><span><b>Meer</b>Hier vind je Terug (laatste zet ongedaan maken), Wis het bord en Automatische kruisjes: die strepen de rij en kolom van elke geplaatste persoon voor je weg.</span></div>
  </div>
  <p class="ver">Versie 37</p>`;
}
function boot(data){
  renderRules();
  const hm=location.hash.match(/^#zaak-([1-3])(\d{3,6})$/);
  if(hm){try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}
    const d=LVLR[hm[1]],sd=+hm[2],sv=loadSaved();
    if(sv&&sv.diff===d&&sv.seed===sd)start(d,sd,sv);else start(d,sd);
    setTimeout(()=>toast(`Je speelt nu zaak ${hm[1]}${hm[2]} met je vriend.`,4000),300);return}
  const s=(data&&data.state)||loadSaved();
  if(s&&DIFF[s.diff]&&s.seed&&Array.isArray(s.place)){start(s.diff,s.seed,s);return}
  start('makkelijk',2718);
  try{if(!localStorage.getItem('murdoku-seen')){localStorage.setItem('murdoku-seen','1');$('#rulesDlg').showModal()}}catch(e){}
}
boot({});
if('serviceWorker' in navigator){
  // Nieuwe versie actief? Dan de pagina één keer herladen (alleen bij een update, niet bij de eerste installatie)
  const hadSW=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!hadSW||reloaded)return;reloaded=true;location.reload()});
  addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(reg=>{
    const kick=()=>{if(reg.waiting)reg.waiting.postMessage('skipWaiting')};
    kick();
    reg.addEventListener('updatefound',()=>{const w=reg.installing;w&&w.addEventListener('statechange',()=>{if(w.state==='installed')kick()})});
    reg.update();
    // Een app op het beginscherm blijft vaak open: kijk bij elke terugkeer naar de app of er een update is
    document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')reg.update().catch(()=>{})});
  }).catch(()=>{}));
}
}
